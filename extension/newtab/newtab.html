<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Browser Sanity</title>
    <link rel="stylesheet" href="newtab.css" />
  </head>
  <body>
    <main class="page">
      <header class="pageHeader">
        <h1>Browser Sanity</h1>
        <input id="search" class="search" type="search" placeholder="Filter groups by name…" aria-label="Filter groups by name" autocomplete="off" />
        <button id="openPanel" class="openPanel" type="button">Open side panel</button>
      </header>
      <p id="panelNote" class="helperNote" hidden>Click the Browser Sanity toolbar icon to open the side panel.</p>
      <p id="helperNote" class="helperNote" hidden>The helper isn't reachable, so parked groups can't be shown — only your open groups are listed.</p>
      <div id="board" class="board"></div>
      <footer class="pageFooter">Browser Sanity · <span id="ntVersion"></span></footer>
    </main>
    <script type="module" src="newtab.js"></script>
  </body>
</html>
